repos:
  - repo: local
    hooks:
      - id: make-check
        name: Run all checks via make
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
      - id: c-check
        name: Run C static analysis
        entry: make -C c check
        language: system
        pass_filenames: false
        always_run: true